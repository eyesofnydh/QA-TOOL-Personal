services:
  - type: web
    name: site-audit-console
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: AUTH_USER
        sync: false
      - key: AUTH_PASS
        sync: false
      - key: NODE_ENV
        value: production
      - key: MAX_ACTIVE_CRAWLS
        value: "1"
